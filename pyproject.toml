[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monoyield-predictor"
version = "0.1.0"
description = "Sequence-based predictors of E. coli monomeric expression yield (ESMC-MonoYield, SaProt LoRA, ESMC-Nb-MonoYield / MDRatio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Versions below are the ones the models were trained/evaluated with (conda env "esmc-6000").
dependencies = [
  "torch>=2.4",          # trained with 2.12.0.dev+cu128 (Blackwell GPUs need a CUDA 12.8 build)
  "transformers==4.57.6",   # environment under verification (see README)
  "peft==0.19.1",
  "accelerate>=1.0",
  "huggingface_hub",
  "safetensors",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
]

[tool.setuptools]
py-modules = []
