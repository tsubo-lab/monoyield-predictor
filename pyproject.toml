[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monoyield-predictor"
version = "0.1.0"
description = "Sequence-based predictors of E. coli monomeric expression yield (ESMC-MonoYield, SaProt LoRA, ESMC-Nb-MonoYield / MDRatio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Environment for scripts_esm34/ (see README). The paper environment (esm 3.3.0 + Biohub transformers fork,
# torch 2.12.0.dev+cu128, conda env "esmc-6000") can no longer be rebuilt from scratch.
dependencies = [
  "esm==3.4.2",                    # pulls torch>=2.11,<2.12 and transformers>=4.57.6,<5
  "torch>=2.11,<2.12",
  "transformers>=4.57.6,<5",
  "peft==0.19.1",
  "accelerate>=1.0",
  "huggingface_hub",
  "safetensors",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
]

[tool.setuptools]
py-modules = []
